[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-actions-ref"
version = "0.1.0"
description = "Sphinx extension to generate reference pages from Juju charm actions.yaml files"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Canonical"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
]
dependencies = [
    "sphinx>=5",
    "pyyaml>=6",
    "jinja2>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "myst-parser>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sphinx_actions_ref = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
